{% extends "booking/base.html" %}
{% block title %}Вход{% endblock %}
{% block content %}
<section class="panel login"><p class="eyebrow">Бронирование оборудования</p><h1>Вход в практикум</h1>
<form method="post" class="stack">
  {% csrf_token %}{{ form.non_field_errors }}
  {% for field in form %}<div><label for="{{ field.id_for_label }}">{{ field.label }}</label>{{ field }}{{ field.errors }}</div>{% endfor %}
  <input type="hidden" name="next" value="{{ next }}"><button>Войти</button>
</form></section>
{% endblock %}
